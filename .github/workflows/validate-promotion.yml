name: validate-promotion

on:
  # Run the workflow definition from the trusted default branch. Candidate
  # workflow and validator files must never execute with the authorization key.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  trusted-authorization-runner:
    name: trusted-authorization-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator at the exact base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out candidate bytes without executing candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Mark the exact PR head authorization as pending
        env:
          TARGET_STATUS_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/head_status.py pending
      - name: Execute only the trusted-base validator
        id: validate
        env:
          PROMOTION_AUTHORIZATION_KEY: ${{ secrets.PROMOTION_AUTHORIZATION_KEY }}
          TARGET_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          TARGET_TRUSTED_ROOT: ${{ github.workspace }}/trusted
        run: python3 trusted/tools/target_check.py
      - name: Publish the required status on the exact PR head
        if: always()
        env:
          TARGET_STATUS_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: >-
          python3 trusted/tools/head_status.py
          "${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}"
